<!DOCTYPE html>
<html lang="ru">
<head>
    {% include 'embed-auth.html' %}
    <script>
        const annotationId = {{annotation_id}};
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Экспорт разметки</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4895ef;
            --light-color: #f8f9fa;
            --dark-color: #212529;
            --success-color: #4cc9f0;
            --border-radius: 8px;
            --box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', sans-serif;
            line-height: 1.6;
            color: var(--dark-color);
            background-color: #f5f7fa;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .task-card {
            background: white;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            padding: 30px;
            margin-bottom: 30px;
        }
        
        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .task-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--primary-color);
        }
        
        .task-id {
            background: var(--primary-color);
            color: white;
            padding: 5px 10px;
            border-radius: var(--border-radius);
            font-weight: 500;
        }
        
        .task-section {
            margin-bottom: 25px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
            color: var(--secondary-color);
        }
        
        .task-description {
            font-size: 16px;
            line-height: 1.7;
        }
        
        .export-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .option-group {
            background: var(--light-color);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
        }
        
        .option-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
            color: var(--secondary-color);
        }
        
        .checkbox-group {
            margin-bottom: 15px;
        }
        
        .checkbox-label {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
        }
        
        .checkbox-input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .select-input {
            width: 100%;
            padding: 10px;
            border-radius: var(--border-radius);
            border: 1px solid #ddd;
            font-family: inherit;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .btn-export {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--box-shadow);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .btn-export:hover {
            background: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        
        .btn-export i {
            font-size: 18px;
        }
        
        .export-status {
            margin-top: 20px;
            padding: 15px;
            border-radius: var(--border-radius);
            background: #e8f5e9;
            color: #388e3c;
            display: none;
        }
        
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary-color);
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .format-options {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .format-option {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            background: #f0f0f0;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .format-option:hover {
            background: #e0e0e0;
        }
        
        .format-option input {
            margin-right: 8px;
        }
        
        .format-option.active {
            background: var(--accent-color);
            color: white;
        }
    </style>
    {% block styles %}{% endblock %}
</head>
<body>
    {% include 'top-panel.html' %}
    <div class="container main-content">
        <div class="task-card">
            <div class="task-header">
                <h1 class="task-title">Экспорт разметки</h1>
            </div>
            
            <div class="task-section">
                <h2 class="section-title">Настройки экспорта</h2>
                <div class="export-options">
                    <div class="option-group">
                        <h3 class="option-title">Формат экспорта</h3>
                        <select class="select-input" id="export-format">
                            <option value="json">JSON</option>
                        </select>
                        
                        <!-- <div class="checkbox-group">
                            <h3 class="option-title">Типы разметки</h3>
                            <label class="checkbox-label">
                                <input type="checkbox" class="checkbox-input" id="export-bbox" checked>
                                Детекция (Bounding Boxes)
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" class="checkbox-input" id="export-segmentation" checked>
                                Сегментация
                            </label>
                            <label class="checkbox-label">
                                <input type="checkbox" class="checkbox-input" id="export-classification" checked>
                                Классификация
                            </label>
                        </div> -->
                    </div>
                    
                    <div class="option-group" style="display: none;">
                        <h3 class="option-title">Дополнительные опции</h3>
                        <label class="checkbox-label">
                            <input type="checkbox" class="checkbox-input" id="include-images">
                            Включить изображения в архив
                        </label>
                    </div>
                </div>
                
                <button id="export-btn" class="btn-export">
                    <i class="fas fa-file-export"></i> Экспортировать
                </button>
                
                <div id="export-status" class="export-status">
                    <i class="fas fa-check-circle"></i> Экспорт успешно завершен!
                </div>
            </div>
            
            <!-- <div class="task-section">
                <h2 class="section-title">Информация о датасете</h2>
                <div class="stats-container">
                    <div class="stat-card">
                        <div class="stat-value" id="total-images">0</div>
                        <div class="stat-label">Всего изображений</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="labeled-images">0</div>
                        <div class="stat-label">Размеченных изображений</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="bbox-count">0</div>
                        <div class="stat-label">Bounding Boxes</div>
                    </div>
                </div>
            </div> -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            document.getElementById('export-btn').addEventListener('click', function() {
                const exportFormat = document.getElementById('export-format').value;
                const includeBbox = true // document.getElementById('export-bbox').checked;
                const includeSeg = true // document.getElementById('export-segmentation').checked;
                const includeCls = true // document.getElementById('export-classification').checked;
                const includeImages = false // document.getElementById('include-images').checked;

                // Параметры запроса
                const params = {
                    export_format: exportFormat,
                    include_bbox: includeBbox,
                    include_seg: includeSeg,
                    include_cls: includeCls,
                    include_images: includeImages
                };

                fetch(`/api/annotations/${annotationId}/export`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(params)
                })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Ошибка при экспорте аннотаций');
                    }
                    return response.blob();
                })
                .then(blob => {
                    const downloadUrl = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = `annotation_${annotationId}_export.zip`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    window.URL.revokeObjectURL(downloadUrl);
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert(error.message);
                });
            });
            
            // loadDatasetStats();
        });
        
        // function loadDatasetStats() {

        //     document.getElementById('total-images').textContent = '1,245';
        //     document.getElementById('labeled-images').textContent = '932';
        //     document.getElementById('bbox-count').textContent = '3,784';
        // }
    </script>
</body>
</html>
