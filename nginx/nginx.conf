user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  /var/log/nginx/access.log  main;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip  on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/xml+rss text/javascript image/svg+xml;

    upstream clat {
        server main:5000;
    }

    # --- HTTP: редирект на HTTPS ---
    server {
        listen       80;
        server_name  <domen_name>;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS ---
    server {
        listen       443 ssl;
        http2        on;
        server_name  <domen_name>;

        # Пока лежит самоподписанный сертификат. При финальном деплое
        # сюда кладём сертификаты (live/<домен>/fullchain.pem, privkey.pem)
        ssl_certificate     /etc/letsencrypt/live/<domen_name>/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/<domen_name>/privkey.pem;

        # Максимальный размер загружаемых файлов (картинки заданий, JSON предразметки)
        client_max_body_size 200m;

        location / {
            proxy_pass         http://clat;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_connect_timeout 75s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
        }
    }

    # --- Заглушка для любых других имён (доступ по IP без Host) ---
    server {
        listen       80 default_server;
        server_name  _;
        return       444;
    }
}